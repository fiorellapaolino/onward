# Genera la versión de Windows (.exe dentro de un .zip) en los servidores de GitHub,
# sin necesidad de usar un ordenador con Windows.
# Se ejecuta a mano desde la pestaña "Actions" del repo → "Build" → "Run workflow".
name: Build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.zip
